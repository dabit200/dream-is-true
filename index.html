<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dream is True</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      background:
      radial-gradient(circle at top,#4338ca,#111827 60%);
      color:white;
    }

    /* Glow Background */
    .bg1,.bg2{
      position:absolute;
      border-radius:50%;
      filter:blur(100px);
      opacity:0.5;
    }

    .bg1{
      width:350px;
      height:350px;
      background:#8b5cf6;
      top:-100px;
      left:-100px;
      animation:move1 8s infinite alternate;
    }

    .bg2{
      width:300px;
      height:300px;
      background:#06b6d4;
      bottom:-100px;
      right:-100px;
      animation:move2 8s infinite alternate;
    }

    @keyframes move1{
      from{transform:translate(0,0);}
      to{transform:translate(60px,40px);}
    }

    @keyframes move2{
      from{transform:translate(0,0);}
      to{transform:translate(-50px,-30px);}
    }

    /* Card */
    .card{
      position:relative;
      width:380px;
      padding:35px;
      border-radius:35px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter:blur(18px);
      box-shadow:
      0 15px 35px rgba(0,0,0,0.5),
      inset 0 0 15px rgba(255,255,255,0.05);
      text-align:center;
      z-index:2;
    }

    /* Music Circle */
    .music-circle{
      width:230px;
      height:230px;
      margin:auto;
      border-radius:50%;
      background:
      linear-gradient(135deg,#8b5cf6,#06b6d4);
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      animation:spin 10s linear infinite;
      box-shadow:
      0 0 30px rgba(139,92,246,0.7),
      0 0 60px rgba(6,182,212,0.4);
    }

    .music-circle::before{
      content:"";
      position:absolute;
      width:60px;
      height:60px;
      border-radius:50%;
      background:#111827;
    }

    .emoji{
      font-size:90px;
      z-index:1;
    }

    @keyframes spin{
      from{transform:rotate(0deg);}
      to{transform:rotate(360deg);}
    }

    h1{
      margin-top:25px;
      font-size:32px;
      font-weight:bold;
      letter-spacing:1px;
    }

    .subtitle{
      margin-top:8px;
      color:#cbd5e1;
      font-size:15px;
    }

    /* Visualizer */
    .visualizer{
      margin:30px auto;
      height:50px;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      gap:6px;
    }

    .visualizer span{
      width:7px;
      border-radius:20px;
      background:linear-gradient(to top,#06b6d4,#8b5cf6);
      animation:music 1s infinite ease-in-out;
    }

    .visualizer span:nth-child(1){animation-delay:0s;}
    .visualizer span:nth-child(2){animation-delay:0.2s;}
    .visualizer span:nth-child(3){animation-delay:0.4s;}
    .visualizer span:nth-child(4){animation-delay:0.6s;}
    .visualizer span:nth-child(5){animation-delay:0.8s;}

    @keyframes music{
      0%,100%{
        height:12px;
      }
      50%{
        height:45px;
      }
    }

    audio{
      width:100%;
      border-radius:30px;
    }

    .creator{
      margin-top:18px;
      font-size:14px;
      color:#e2e8f0;
    }

    .creator span{
      color:#8b5cf6;
      font-weight:bold;
      text-shadow:0 0 10px #8b5cf6;
    }

    /* TikTok Button */
    .tiktok{
      margin-top:22px;
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:12px 22px;
      border-radius:50px;
      text-decoration:none;
      color:white;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      transition:0.3s;
      overflow:hidden;
      position:relative;
    }

    .tiktok::before{
      content:"";
      position:absolute;
      width:100%;
      height:100%;
      background:linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.25),
      transparent);
      left:-100%;
      transition:0.5s;
    }

    .tiktok:hover::before{
      left:100%;
    }

    .tiktok:hover{
      transform:translateY(-3px) scale(1.03);
      box-shadow:0 0 20px rgba(139,92,246,0.6);
      background:#000;
    }

    .tiktok svg{
      width:24px;
      height:24px;
      fill:white;
    }

    .footer{
      margin-top:15px;
      font-size:12px;
      color:#94a3b8;
    }

  </style>
</head>
<body>

  <!-- Background Glow -->
  <div class="bg1"></div>
  <div class="bg2"></div>

  <!-- Card -->
  <div class="card">

    <!-- Music Circle -->
    <div class="music-circle">
      <div class="emoji">🎧</div>
    </div>

    <h1>Dream is True</h1>
    <div class="subtitle">
      Relax and enjoy the music ✨
    </div>

    <!-- Visualizer -->
    <div class="visualizer">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Audio -->
    <audio controls autoplay loop>
      <source src="Dream is True.mp3" type="audio/mpeg">
      Browser Anda tidak mendukung audio.
    </audio>

    <!-- Creator -->
    <div class="creator">
      Dibuat oleh <span>Dabit Ganteng</span>
    </div>

    <!-- TikTok -->
    <a 
      href="https://tiktok.com/@dabitreal"
      target="_blank"
      class="tiktok"
    >

      <svg viewBox="0 0 24 24">
        <path d="M19.589 6.686a4.793 4.793 0 0 1-3.77-4.68h-3.257v13.849a2.723 2.723 0 1 1-2.723-2.723c.226 0 .445.028.655.08V9.91a6.018 6.018 0 1 0 5.325 5.945V8.745a8.051 8.051 0 0 0 4.77 1.573V6.686z"/>
      </svg>

      @dabitreal

    </a>

    <div class="footer">
      Music Player • 2026
    </div>

  </div>

</body>
</html>
